
{% block title %}
    Sell Shares
{% endblock %}

{% block main %}
<h1> Sell Shares</h1>
<from action=" /sell " method="post">
     <div class= "form-group">
        <label for = "symbol">Symbol</label>
        <select class = "form-control" id = "symbol" name = "symbol">
          <option value = "">Select a stock<option>
            {% for%}
            <option value = {{ stock.symbol}}>{{ stok.name }} ({{ stock.symbol }})<option>
            {% endfor %}
        </select>  
     <div>  
     <div class = "form-group">
        <input class = "form-control" id = "shares" name = "shares" placeholder = "Number of Shares" type = "number">
    </div>
    <button class = "btn btnprimary" type = "submit">Sell</button>
</from>
{% endblock %}
