{% extends "layout.html" %}
{% block main %}
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">{{ t('plans_pay_title') }}</h1>
        <p class="page-subtitle">{{ plan | upper }} — {{ t('plans_pro' if plan == 'pro' else 'plans_enterprise') }}</p>
    </div>

    <div class="pay-card">
        <form action="{{ url_for('pay', plan=plan) }}" method="post">
            <div class="pay-field">
                <label>{{ t('auth_username') }}</label>
                <input class="glass-input" type="text" value="{{ current_user.username }}" readonly>
            </div>
            <div class="pay-field">
                <label>Card number</label>
                <input class="glass-input" type="text" placeholder="4242 4242 4242 4242" required>
            </div>
            <div class="pay-row">
                <div class="pay-field half">
                    <label>MM/YY</label>
                    <input class="glass-input" type="text" placeholder="12/28" required>
                </div>
                <div class="pay-field half">
                    <label>CVC</label>
                    <input class="glass-input" type="text" placeholder="123" required>
                </div>
            </div>
            <button class="plan-btn pay-submit" type="submit"><i class="fa-solid fa-lock"></i> {{ t('plans_pay_btn') }}</button>
        </form>
    </div>
</div>
{% endblock %}
